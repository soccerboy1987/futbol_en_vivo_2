<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoccerBoy MX | Agenda y Resúmenes</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/53/53283.png">
</head>

<body>

<div class="topbar">
    <div class="brand">
        <div class="logo">⚽</div>
        <div>
            <h1>SoccerBoy MX</h1>
            <span class="subtitle">Agenda y Resúmenes</span>
        </div>
    </div>

    <select id="leagueFilter">
        <option value="all">Todas</option>
        <option value="laliga">LaLiga</option>
        <option value="premier">Premier</option>
        <option value="ligamx">Liga MX</option>
        <option value="champions">Champions</option>
        <option value="amistoso">Amistoso</option>
    </select>
</div>

<div class="container"></div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <span id="close">✖</span>
        <div id="options"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
